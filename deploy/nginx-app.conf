# /etc/nginx/snippets/wa_app.conf — the app: theme assets from disk, everything else to Next.js.
client_max_body_size 100M;

gzip on;
gzip_comp_level 5;
gzip_min_length 1024;
gzip_proxied any;
gzip_vary on;
gzip_types text/css application/javascript text/javascript application/json image/svg+xml text/plain application/xml font/ttf application/vnd.ms-fontobject;

location ^~ /assets/ { root /var/www/wa/current/public; expires 7d; access_log off; try_files $uri =404; }
location ^~ /css/    { root /var/www/wa/current/public; expires 7d; access_log off; try_files $uri =404; }
# Build files of every release (deploy.sh copies them here), so pages opened before a deploy keep working
location ^~ /_next/static/ { root /var/www/wa/shared/web; expires 365d; access_log off; try_files $uri @app; }
location @app { proxy_pass http://127.0.0.1:3000; }

location / { include snippets/wa_proxy.conf; }
