# /etc/nginx/sites-available/wa_next_js — Next.js on 127.0.0.1:3000, theme assets straight from disk.
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;
    client_max_body_size 100M;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_vary on;
    gzip_types text/css application/javascript text/javascript application/json image/svg+xml text/plain application/xml font/ttf application/vnd.ms-fontobject;

    location ^~ /assets/ { root /var/www/wa/current/public; expires 7d; access_log off; try_files $uri =404; }
    location ^~ /css/    { root /var/www/wa/current/public; expires 7d; access_log off; try_files $uri =404; }
    location ^~ /_next/static/ { proxy_pass http://127.0.0.1:3000; expires 365d; access_log off; }

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 300s;
    }
}
