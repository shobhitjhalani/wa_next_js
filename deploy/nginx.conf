# /etc/nginx/sites-available/wa_next_js — Next.js on 127.0.0.1:3000, theme assets straight from disk.
# Includes /etc/nginx/snippets/wa_app.conf (deploy/nginx-app.conf). HTTPS on app.digitomation.com
# (Let's Encrypt via certbot, auto-renewed; the renewal reloads nginx).

# HTTP (any host, also the bare IP): machine endpoints (Meta webhook, client APIs, Shopify) keep
# working over plain HTTP, since POST clients don't follow redirects; panel pages move to HTTPS
# (login cookies are Secure once APP_URL is https).
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    location ^~ /.well-known/acme-challenge/ { root /var/www/html; }
    location ^~ /waapi/ { include snippets/wa_proxy.conf; }
    location ^~ /api/   { include snippets/wa_proxy.conf; }
    location ^~ /wa/    { include snippets/wa_proxy.conf; }
    location / { return 301 https://app.digitomation.com$request_uri; }
}

server {
    listen 443 ssl http2 default_server;
    listen [::]:443 ssl http2 default_server;
    server_name app.digitomation.com;

    ssl_certificate     /etc/letsencrypt/live/app.digitomation.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/app.digitomation.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    include snippets/wa_app.conf;
}
