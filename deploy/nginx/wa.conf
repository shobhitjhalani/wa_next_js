# Nginx site for the Next.js app. Install:
#   sudo cp deploy/nginx/wa.conf /etc/nginx/sites-available/wa.conf
#   sudo sed -i 's/new.wa.jscoretech.com/YOUR.DOMAIN/g' /etc/nginx/sites-available/wa.conf   # if different
#   sudo ln -sf /etc/nginx/sites-available/wa.conf /etc/nginx/sites-enabled/wa.conf
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d new.wa.jscoretech.com     # adds the HTTPS server block + redirect
#
# Before certbot runs this serves plain HTTP on port 80, which certbot needs.

upstream wa_next {
    server 127.0.0.1:3000;
    keepalive 32;
}

server {
    listen 80;
    listen [::]:80;
    server_name new.wa.jscoretech.com;

    # Same limit as the PHP app (upload_max_filesize / post_max_size = 25M), plus headroom.
    client_max_body_size 30m;

    # Real client IP: the app logs it for logins (x-forwarded-for).
    real_ip_header X-Forwarded-For;
    set_real_ip_from 127.0.0.1;

    # Security headers
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    server_tokens off;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript text/javascript
               application/xml image/svg+xml application/rss+xml font/ttf font/otf;

    # Let's Encrypt HTTP-01 challenge
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/html;
        allow all;
    }

    # Never serve dotfiles (.env, .git, .htaccess ...)
    location ~ /\. {
        deny all;
        return 404;
    }

    # Uploaded / generated media, straight from disk (MEDIA_ROOT). WhatsApp fetches
    # these links when delivering attachments, so they must stay public.
    location /media/ {
        alias /var/www/wa/shared/media/;
        access_log off;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
        add_header X-Content-Type-Options "nosniff" always;
        # Never execute anything from the upload folder.
        location ~* \.(php|phtml|pl|py|sh|cgi)$ { deny all; }
        try_files $uri =404;
    }

    # Next.js build assets are content-hashed: cache for a year.
    location /_next/static/ {
        proxy_pass http://wa_next;
        expires 365d;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
    }

    location / {
        proxy_pass http://wa_next;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";

        # Webhooks (Meta, Shopify) and report exports can take a while.
        proxy_connect_timeout 10s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
        proxy_buffering on;
        proxy_buffers 16 32k;
        proxy_buffer_size 32k;
    }
}
